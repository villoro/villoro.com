<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="aRed2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 z" fill="#e5484d"/>
    </marker>
    <marker id="aBlue2" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L10 6 L1 11 z" fill="#3a76ff"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="1596" height="896" rx="24" fill="#fbfbfd" stroke="#eaedf2" stroke-width="2"/>
  <line x1="705" y1="170" x2="705" y2="800" stroke="#eaedf2" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- ============ BEFORE (region 100..680) ============ -->
  <text x="390" y="95" text-anchor="middle" font-size="34" font-weight="700" fill="#0b1026">Before</text>
  <text x="390" y="132" text-anchor="middle" font-size="21" fill="#6a6e82">every job alerts on its own</text>

  <!-- job column centered at y=475: tops 255,375,495,615 (h=80) -->
  <g font-size="21" font-weight="600" fill="#fff">
    <rect x="100" y="255" width="190" height="80" rx="12" fill="#3a76ff"/><text x="195" y="303" text-anchor="middle">job A</text>
    <rect x="100" y="375" width="190" height="80" rx="12" fill="#3a76ff"/><text x="195" y="423" text-anchor="middle">job B</text>
    <rect x="100" y="495" width="190" height="80" rx="12" fill="#3a76ff"/><text x="195" y="543" text-anchor="middle">job C</text>
    <rect x="100" y="615" width="190" height="80" rx="12" fill="#3a76ff"/><text x="195" y="663" text-anchor="middle">job D</text>
  </g>

  <!-- Slack: wider than tall, centered at y=475 -->
  <rect x="500" y="420" width="180" height="110" rx="16" fill="#4A154B"/>
  <text x="590" y="483" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Slack</text>

  <!-- all arrows converge to (500, 475), 210px run -->
  <path d="M290 295 C 400 320, 450 460, 500 475" fill="none" stroke="#e5484d" stroke-width="2.5" marker-end="url(#aRed2)"/>
  <path d="M290 415 C 400 440, 450 468, 500 475" fill="none" stroke="#e5484d" stroke-width="2.5" marker-end="url(#aRed2)"/>
  <path d="M290 535 C 400 520, 450 490, 500 475" fill="none" stroke="#e5484d" stroke-width="2.5" marker-end="url(#aRed2)"/>
  <path d="M290 655 C 400 610, 450 500, 500 475" fill="none" stroke="#e5484d" stroke-width="2.5" marker-end="url(#aRed2)"/>

  <text x="390" y="805" text-anchor="middle" font-size="19" fill="#6a6e82">duplicated logic · raw alerts · nothing stored</text>

  <!-- ============ AFTER (region 730..1500) ============ -->
  <text x="1115" y="95" text-anchor="middle" font-size="34" font-weight="700" fill="#0b1026">After</text>
  <text x="1115" y="132" text-anchor="middle" font-size="21" fill="#6a6e82">every job reports to one service</text>

  <g font-size="21" font-weight="600" fill="#fff">
    <rect x="730" y="255" width="170" height="80" rx="12" fill="#3a76ff"/><text x="815" y="303" text-anchor="middle">job A</text>
    <rect x="730" y="375" width="170" height="80" rx="12" fill="#3a76ff"/><text x="815" y="423" text-anchor="middle">job B</text>
    <rect x="730" y="495" width="170" height="80" rx="12" fill="#3a76ff"/><text x="815" y="543" text-anchor="middle">job C</text>
    <rect x="730" y="615" width="170" height="80" rx="12" fill="#3a76ff"/><text x="815" y="663" text-anchor="middle">job D</text>
  </g>

  <!-- hero service: wider than tall, centered at y=475 -->
  <rect x="1070" y="405" width="200" height="140" rx="16" fill="#ffc33a"/>
  <text x="1170" y="458" text-anchor="middle" font-size="23" font-weight="700" fill="#0b1026">hero service</text>
  <text x="1170" y="496" text-anchor="middle" font-size="18" fill="#0b1026">store · dedup</text>
  <text x="1170" y="520" text-anchor="middle" font-size="18" fill="#0b1026">enrich · alert</text>

  <!-- all arrows converge to (1070, 475), 170px run -->
  <path d="M900 295 C 980 320, 1030 460, 1070 475" fill="none" stroke="#3a76ff" stroke-width="2.5" marker-end="url(#aBlue2)"/>
  <path d="M900 415 C 980 440, 1030 468, 1070 475" fill="none" stroke="#3a76ff" stroke-width="2.5" marker-end="url(#aBlue2)"/>
  <path d="M900 535 C 980 520, 1030 490, 1070 475" fill="none" stroke="#3a76ff" stroke-width="2.5" marker-end="url(#aBlue2)"/>
  <path d="M900 655 C 980 610, 1030 500, 1070 475" fill="none" stroke="#3a76ff" stroke-width="2.5" marker-end="url(#aBlue2)"/>

  <!-- Slack after: same size (180x110) and same y as before, aligned -->
  <rect x="1320" y="420" width="180" height="110" rx="16" fill="#4A154B"/>
  <text x="1410" y="483" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Slack</text>
  <path d="M1270 475 L1320 475" fill="none" stroke="#e5484d" stroke-width="3" marker-end="url(#aRed2)"/>

  <text x="1115" y="805" text-anchor="middle" font-size="19" fill="#6a6e82">one clean alert · full history kept</text>
</svg>
