<svg viewBox="0 0 1600 820" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Small pages in, big batches out</title>
  <desc id="d">The API returns rows in pages of 10k, and each page goes into a DuckDB temp table while Python holds only one page at a time. Once the run is staged, the rows are sorted by the filter column and merged into the Iceberg table in batches of 1M rows, oldest first, one commit per batch.</desc>
  <style>
    .card { fill: #ffffff; }
    .ttl, .txt { fill: #1f2333; }
    .mut { fill: #6a6e82; }
    .box { fill: #f3f5fb; stroke: #a6accb; }
    .cont { fill: #fafbfe; stroke: #6a6e82; }
    .e { fill: #e3ecff; stroke: #3a76ff; } .et { fill: #1f4fbf; }
    .l { fill: #dcf5ea; stroke: #0f9d6b; } .lt { fill: #0b6b49; }
    .row { fill: #d9dceb; }
    .dot { fill: #6a6e82; } .ldot { fill: #0b6b49; }
    .gln { stroke: #6a6e82; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #171a2b; }
      .ttl, .txt { fill: #e8eaf6; }
      .mut { fill: #b4afb6; }
      .box { fill: #23263a; stroke: #6a6e82; }
      .cont { fill: #1d2034; stroke: #9aa0b5; }
      .e { fill: #1c2a4d; stroke: #5b8cff; } .et { fill: #b9ceff; }
      .l { fill: #12352a; stroke: #1fae7a; } .lt { fill: #9fe3c6; }
      .row { fill: #3a3e58; }
      .dot { fill: #b4afb6; } .ldot { fill: #9fe3c6; }
      .gln { stroke: #9aa0b5; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L10 6 L1 11 z" fill="#6a6e82"/>
    </marker>
  </defs>
  <rect width="1600" height="820" rx="24" class="card"/>

  <text x="800" y="66" text-anchor="middle" font-size="40" font-weight="700" class="ttl">Small pages in, big batches out</text>
  <text x="800" y="106" text-anchor="middle" font-size="23" class="mut">two sizes, for two different limits: Python's memory on the way in, the merge's on the way out</text>

  <!-- API -->
  <rect x="60" y="330" width="170" height="110" rx="14" class="box" stroke-width="2"/>
  <text x="145" y="392" text-anchor="middle" font-size="22" font-weight="600" class="txt">API</text>

  <!-- pages (E) -->
  <text x="390" y="180" text-anchor="middle" font-size="24" font-weight="700" class="et">Pages of 10k rows</text>
  <g>
    <rect x="300" y="210" width="180" height="56" rx="10" class="e" stroke-width="2.5"/>
    <rect x="300" y="282" width="180" height="56" rx="10" class="e" stroke-width="2.5"/>
    <rect x="300" y="354" width="180" height="56" rx="10" class="e" stroke-width="2.5"/>
    <rect x="300" y="426" width="180" height="56" rx="10" class="e" stroke-width="2.5"/>
    <circle cx="390" cy="499" r="3.5" class="dot"/><circle cx="390" cy="511" r="3.5" class="dot"/><circle cx="390" cy="523" r="3.5" class="dot"/>
    <rect x="300" y="540" width="180" height="56" rx="10" class="e" stroke-width="2.5"/>
  </g>
  <text x="390" y="642" text-anchor="middle" font-size="20" class="txt">Python holds one page</text>
  <text x="390" y="670" text-anchor="middle" font-size="20" class="txt">at a time</text>
  <line x1="232" y1="385" x2="292" y2="385" class="gln" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- staging -->
  <rect x="580" y="190" width="420" height="420" rx="20" class="cont" stroke-width="2.5"/>
  <text x="790" y="232" text-anchor="middle" font-size="24" font-weight="700" class="txt">DuckDB temp table</text>
  <text x="790" y="262" text-anchor="middle" font-size="19" class="mut">every row of the run</text>
  <g>
    <rect x="620" y="285" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="309" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="333" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="357" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="381" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="405" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="429" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="453" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="477" width="340" height="16" rx="4" class="row"/>
    <rect x="620" y="501" width="340" height="16" rx="4" class="row"/>
  </g>
  <text x="790" y="555" text-anchor="middle" font-size="20" class="txt">deduplicated, sorted by</text>
  <text x="790" y="583" text-anchor="middle" font-size="20" class="txt">the filter column</text>
  <text x="790" y="650" text-anchor="middle" font-size="20" class="mut">spills to disk when it doesn't fit in memory</text>
  <line x1="484" y1="400" x2="572" y2="400" class="gln" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- batches (L) -->
  <text x="1170" y="180" text-anchor="middle" font-size="24" font-weight="700" class="lt">Merges of 1M rows</text>
  <g>
    <rect x="1080" y="210" width="180" height="110" rx="12" class="l" stroke-width="2.5"/>
    <text x="1170" y="272" text-anchor="middle" font-size="20" font-weight="600" class="lt">oldest</text>
    <rect x="1080" y="340" width="180" height="110" rx="12" class="l" stroke-width="2.5"/>
    <circle cx="1170" cy="383" r="3.5" class="ldot"/><circle cx="1170" cy="395" r="3.5" class="ldot"/><circle cx="1170" cy="407" r="3.5" class="ldot"/>
    <rect x="1080" y="470" width="180" height="110" rx="12" class="l" stroke-width="2.5"/>
    <text x="1170" y="532" text-anchor="middle" font-size="20" font-weight="600" class="lt">newest</text>
  </g>
  <text x="1170" y="642" text-anchor="middle" font-size="20" class="txt">one commit each</text>
  <text x="1170" y="670" text-anchor="middle" font-size="20" class="txt">(usually just one)</text>
  <line x1="1004" y1="400" x2="1072" y2="400" class="gln" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- iceberg -->
  <rect x="1350" y="330" width="190" height="110" rx="14" class="box" stroke-width="2"/>
  <text x="1445" y="380" text-anchor="middle" font-size="22" font-weight="600" class="txt">Iceberg</text>
  <text x="1445" y="408" text-anchor="middle" font-size="19" class="mut">table</text>
  <line x1="1264" y1="385" x2="1342" y2="385" class="gln" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="800" y="760" text-anchor="middle" font-size="22" font-weight="600" class="txt">A nightly run is a handful of pages and a single merge. A backfill is many pages and a few merges.</text>
</svg>
