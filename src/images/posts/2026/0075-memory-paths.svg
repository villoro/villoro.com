<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Peak memory of one write, by rows in the write</title>
  <desc id="d">Same synthetic Salesforce rows. pandas: 0.74 GB at 50k rows, 2.45 GB at 200k, about 11 KB more per row. Arrow plus DuckDB: 0.69 GB at 50k, 1.01 GB at 200k, 1.57 GB at 500k, about 2 KB more per row.</desc>
  <style>
    .card { fill: #ffffff; }
    .ttl, .txt { fill: #1f2333; }
    .mut { fill: #6a6e82; }
    .grid { stroke: #e3e6ef; }
    .axis { stroke: #a6accb; }
    .pd { stroke: #d97706; fill: #d97706; }
    .dk { stroke: #3a76ff; fill: #3a76ff; }
    .ring { stroke: #ffffff; }
    .dkt { fill: #3a76ff; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #171a2b; }
      .ttl, .txt { fill: #e8eaf6; }
      .mut { fill: #b4afb6; }
      .grid { stroke: #2c3048; }
      .axis { stroke: #6a6e82; }
      .dk { stroke: #5b8cff; fill: #5b8cff; }
      .ring { stroke: #171a2b; }
      .dkt { fill: #5b8cff; }
    }
  </style>
  <rect width="1600" height="900" rx="24" class="card"/>

  <text x="100" y="80" font-size="40" font-weight="700" class="ttl">Peak memory of one write</text>
  <text x="100" y="122" font-size="23" class="mut">same Salesforce-like rows (~100 fields), by how many rows go in one write</text>

  <!-- y: 0 at 780, 1 GB = 180 px -->
  <g font-size="19" class="mut" text-anchor="end">
    <text x="200" y="786">0</text><text x="200" y="606">1 GB</text><text x="200" y="426">2 GB</text><text x="200" y="246">3 GB</text>
  </g>
  <g class="grid" stroke-width="1.5">
    <line x1="220" y1="600" x2="1440" y2="600"/><line x1="220" y1="420" x2="1440" y2="420"/><line x1="220" y1="240" x2="1440" y2="240"/>
  </g>
  <line x1="220" y1="780" x2="1440" y2="780" class="axis" stroke-width="2"/>
  <!-- x: 50k at 250, 500k at 1400 -->
  <g font-size="20" class="mut" text-anchor="middle">
    <text x="250" y="815">50k</text><text x="633" y="815">200k</text><text x="1400" y="815">500k rows</text>
  </g>
  <line x1="250" y1="780" x2="250" y2="788" class="axis" stroke-width="2"/>
  <line x1="633" y1="780" x2="633" y2="788" class="axis" stroke-width="2"/>
  <line x1="1400" y1="780" x2="1400" y2="788" class="axis" stroke-width="2"/>
  <text x="250" y="848" font-size="18" class="mut" text-anchor="middle">our old chunk</text>

  <!-- pandas: (250,647) (633,339) -->
  <polyline points="250,647 633,339" fill="none" class="pd" stroke-width="3"/>
  <circle cx="250" cy="647" r="7" class="pd ring" stroke-width="2"/>
  <circle cx="633" cy="339" r="7" class="pd ring" stroke-width="2"/>
  <text x="633" y="318" text-anchor="middle" font-size="22" font-weight="600" class="txt">2.45 GB</text>
  <text x="660" y="378" font-size="22" font-weight="700" fill="#d97706">pandas + write_iceberg: +11 KB a row</text>

  <!-- duckdb: (250,656) (633,598) (1400,497) -->
  <polyline points="250,656 633,598 1400,497" fill="none" class="dk" stroke-width="3"/>
  <circle cx="250" cy="656" r="7" class="dk ring" stroke-width="2"/>
  <circle cx="633" cy="598" r="7" class="dk ring" stroke-width="2"/>
  <circle cx="1400" cy="497" r="7" class="dk ring" stroke-width="2"/>
  <text x="633" y="635" text-anchor="middle" font-size="22" font-weight="600" class="txt">1.01 GB</text>
  <text x="1400" y="476" text-anchor="middle" font-size="22" font-weight="600" class="txt">1.57 GB</text>
  <text x="700" y="470" font-size="22" font-weight="700" class="dkt">Arrow pages + DuckDB: +2 KB a row</text>

  <text x="250" y="690" text-anchor="middle" font-size="20" class="txt">about 0.7 GB both</text>
</svg>
