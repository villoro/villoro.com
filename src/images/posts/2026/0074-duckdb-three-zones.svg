<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif">
  <style>
    .card { fill: #ffffff; }
    .ttl { fill: #3a76ff; }
    .txt { fill: #1f2333; }
    .mut { fill: #6a6e82; }
    .gln { stroke: #6a6e82; }
    .zbg { fill: #f3f5fb; }
    .zbg3 { fill: #eceff7; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #171a2b; }
      .ttl { fill: #e8eaf6; }
      .txt { fill: #e8eaf6; }
      .mut { fill: #b4afb6; }
      .gln { stroke: #9aa0b5; }
      .zbg { fill: #23263a; }
      .zbg3 { fill: #2a2e45; }
    }
  </style>
  <defs>
    <marker id="aR" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L10 6 L1 11 z" fill="#6a6e82"/>
    </marker>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#fdecc8"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#f59e0b" stroke-width="6"/>
    </pattern>
  </defs>

  <!-- opaque card: as an <img> the SVG follows the OS theme, not the site's .dark class -->
  <rect width="1600" height="800" rx="24" class="card"/>

  <text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700" class="ttl">Three zones of table size</text>
  <text x="800" y="112" text-anchor="middle" font-size="23" class="mut">DuckDB moves the line where you actually need a cluster</text>

  <!-- zone backgrounds: zone 1 260..620, zone 2 620..1160, zone 3 1160..1540 -->
  <rect x="260" y="150" width="360" height="440" class="zbg"/>
  <rect x="620" y="150" width="540" height="440" class="zbg3"/>
  <rect x="1160" y="150" width="380" height="440" class="zbg"/>

  <text x="440" y="192" text-anchor="middle" font-size="22" font-weight="700" class="mut">ZONE 1</text>
  <text x="440" y="224" text-anchor="middle" font-size="21" class="txt">fits in memory</text>
  <text x="890" y="192" text-anchor="middle" font-size="22" font-weight="700" class="mut">ZONE 2</text>
  <text x="890" y="224" text-anchor="middle" font-size="21" class="txt">bigger than memory, not huge</text>
  <text x="1350" y="192" text-anchor="middle" font-size="22" font-weight="700" class="mut">ZONE 3</text>
  <text x="1350" y="224" text-anchor="middle" font-size="21" class="txt">bigger than one machine</text>

  <!-- frontiers -->
  <line x1="620" y1="150" x2="620" y2="615" class="gln" stroke-width="2.5" stroke-dasharray="6 6"/>
  <text x="620" y="645" text-anchor="middle" font-size="20" class="mut">where teams think</text>
  <text x="620" y="672" text-anchor="middle" font-size="20" class="mut">Spark starts</text>
  <line x1="1160" y1="150" x2="1160" y2="615" stroke="#3a76ff" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="1160" y="645" text-anchor="middle" font-size="20" font-weight="700" fill="#3a76ff">where you actually</text>
  <text x="1160" y="672" text-anchor="middle" font-size="20" font-weight="700" fill="#3a76ff">need it</text>

  <!-- pandas -->
  <text x="235" y="313" text-anchor="end" font-size="26" font-weight="700" class="txt">pandas</text>
  <rect x="275" y="270" width="335" height="66" rx="12" fill="#10b981"/>
  <text x="442" y="311" text-anchor="middle" font-size="21" font-weight="600" fill="#fff">simple</text>
  <rect x="630" y="270" width="520" height="66" rx="12" fill="url(#hatch)" stroke="#f59e0b" stroke-width="2.5"/>
  <rect x="700" y="285" width="380" height="36" rx="8" fill="#fdecc8"/>
  <text x="890" y="311" text-anchor="middle" font-size="21" font-weight="600" fill="#a15c00">batches, bigger tasks, safety nets</text>

  <!-- DuckDB -->
  <text x="235" y="423" text-anchor="end" font-size="26" font-weight="700" class="txt">DuckDB</text>
  <rect x="275" y="380" width="875" height="66" rx="12" fill="#3a76ff"/>
  <text x="712" y="421" text-anchor="middle" font-size="21" font-weight="600" fill="#fff">simple: one pass, spills to disk when memory runs out</text>

  <!-- Spark -->
  <text x="235" y="533" text-anchor="end" font-size="26" font-weight="700" class="txt">Spark</text>
  <rect x="275" y="490" width="875" height="66" rx="12" class="zbg" stroke="#a6accb" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="712" y="531" text-anchor="middle" font-size="21" font-weight="600" class="mut">works, but overkill: cluster, startup, tuning</text>
  <rect x="1170" y="490" width="360" height="66" rx="12" fill="#e25a1c"/>
  <text x="1350" y="531" text-anchor="middle" font-size="21" font-weight="600" fill="#fff">the right tool</text>

  <!-- axis -->
  <line x1="260" y1="725" x2="1530" y2="725" class="gln" stroke-width="2.5" marker-end="url(#aR)"/>
  <text x="1540" y="765" text-anchor="end" font-size="21" class="mut">table size</text>
</svg>
