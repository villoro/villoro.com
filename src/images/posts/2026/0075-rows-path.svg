<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Where the rows go, before and after</title>
  <desc id="d">Before: API, list of dicts, DataFrame, key cleanup and dedup copies, astype(str), Arrow and Parquet in awswrangler, then one Athena merge per chunk. After: API, one page of dicts, Arrow table, DuckDB temp table that spills to disk, then one merge per run (in batches of 1M) into Iceberg.</desc>
  <style>
    .card { fill: #ffffff; }
    .ttl { fill: #1f2333; }
    .txt { fill: #1f2333; }
    .mut { fill: #6a6e82; }
    .box { fill: #f3f5fb; stroke: #a6accb; }
    .old { fill: #fdecc8; stroke: #d97706; }
    .oldt { fill: #a15c00; }
    .new { fill: #e3ecff; stroke: #3a76ff; }
    .newt { fill: #1f4fbf; }
    .gln { stroke: #6a6e82; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #171a2b; }
      .ttl, .txt { fill: #e8eaf6; }
      .mut { fill: #b4afb6; }
      .box { fill: #23263a; stroke: #6a6e82; }
      .old { fill: #3a2a12; stroke: #d97706; }
      .oldt { fill: #f5c27a; }
      .new { fill: #1c2a4d; stroke: #5b8cff; }
      .newt { fill: #b9ceff; }
      .gln { stroke: #9aa0b5; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L10 6 L1 11 z" fill="#6a6e82"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="24" class="card"/>

  <text x="800" y="70" text-anchor="middle" font-size="40" font-weight="700" class="ttl">Where the rows go</text>
  <text x="800" y="112" text-anchor="middle" font-size="23" class="mut">the rows have to pass through Python (it calls the API), but not as a DataFrame</text>

  <!-- BEFORE -->
  <text x="60" y="185" font-size="22" font-weight="700" fill="#d97706">BEFORE · pandas + awswrangler</text>
  <g font-size="21" font-weight="600" text-anchor="middle">
    <rect x="60" y="210" width="170" height="110" rx="14" class="box" stroke-width="2"/>
    <text x="145" y="272" class="txt">API</text>
    <rect x="280" y="210" width="190" height="110" rx="14" class="old" stroke-width="2"/>
    <text x="375" y="258" class="oldt">chunk as</text><text x="375" y="284" class="oldt">list of dicts</text>
    <rect x="520" y="210" width="190" height="110" rx="14" class="old" stroke-width="2"/>
    <text x="615" y="272" class="oldt">DataFrame</text>
    <rect x="760" y="210" width="190" height="110" rx="14" class="old" stroke-width="2"/>
    <text x="855" y="258" class="oldt">dedup +</text><text x="855" y="284" class="oldt">astype(str)</text>
    <rect x="1000" y="210" width="190" height="110" rx="14" class="old" stroke-width="2"/>
    <text x="1095" y="258" class="oldt">Arrow +</text><text x="1095" y="284" class="oldt">Parquet</text>
    <rect x="1240" y="210" width="300" height="110" rx="14" class="box" stroke-width="2"/>
    <text x="1390" y="258" class="txt">Athena MERGE</text><text x="1390" y="284" class="txt">into Iceberg</text>
  </g>
  <g class="gln" stroke-width="2.5" marker-end="url(#a)">
    <line x1="232" y1="265" x2="274" y2="265"/><line x1="472" y1="265" x2="514" y2="265"/>
    <line x1="712" y1="265" x2="754" y2="265"/><line x1="952" y1="265" x2="994" y2="265"/>
    <line x1="1192" y1="265" x2="1234" y2="265"/>
  </g>
  <text x="615" y="365" text-anchor="middle" font-size="20" class="mut">copies alive together: the peak grows with the chunk</text>
  <text x="1390" y="365" text-anchor="middle" font-size="20" class="mut">one commit per chunk</text>
  <path d="M280 335 V345 H950 V335" fill="none" stroke="#d97706" stroke-width="2"/>

  <!-- AFTER -->
  <text x="60" y="505" font-size="22" font-weight="700" fill="#3a76ff">AFTER · Arrow + DuckDB</text>
  <g font-size="21" font-weight="600" text-anchor="middle">
    <rect x="60" y="530" width="170" height="110" rx="14" class="box" stroke-width="2"/>
    <text x="145" y="592" class="txt">API</text>
    <rect x="280" y="530" width="190" height="110" rx="14" class="new" stroke-width="2"/>
    <text x="375" y="578" class="newt">one page</text><text x="375" y="604" class="newt">(10k dicts)</text>
    <rect x="520" y="530" width="190" height="110" rx="14" class="new" stroke-width="2"/>
    <text x="615" y="578" class="newt">Arrow</text><text x="615" y="604" class="newt">table</text>
    <rect x="760" y="530" width="430" height="110" rx="14" class="new" stroke-width="2"/>
    <text x="975" y="578" class="newt">DuckDB temp table</text><text x="975" y="604" class="newt">compressed, spills to disk</text>
    <rect x="1240" y="530" width="300" height="110" rx="14" class="box" stroke-width="2"/>
    <text x="1390" y="578" class="txt">MERGE into</text><text x="1390" y="604" class="txt">Iceberg (Glue)</text>
  </g>
  <g class="gln" stroke-width="2.5" marker-end="url(#a)">
    <line x1="232" y1="585" x2="274" y2="585"/><line x1="472" y1="585" x2="514" y2="585"/>
    <line x1="712" y1="585" x2="754" y2="585"/><line x1="1192" y1="585" x2="1234" y2="585"/>
  </g>
  <!-- loop back: next page -->
  <path d="M615 642 V690 H145 V646" fill="none" class="gln" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/>
  <text x="380" y="720" text-anchor="middle" font-size="20" class="mut">page freed, next page</text>
  <text x="975" y="690" text-anchor="middle" font-size="20" class="mut">read without a copy · dedup only if needed</text>
  <text x="1390" y="690" text-anchor="middle" font-size="20" class="mut">once per run, in batches of 1M</text>

  <text x="800" y="830" text-anchor="middle" font-size="24" font-weight="600" class="txt">Python holds one page at a time. Everything else lives in DuckDB.</text>
</svg>
