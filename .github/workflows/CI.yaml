name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.1.0


  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7


  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: villoro/vhooks/check_version@1.2.0
        with:
          file: package.json
          path: version
      - uses: villoro/vhooks/check_version@1.2.0
        with:
          file: package-lock.json
          path: version


  aspect_ratio_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            images:
              - '.github/scripts/check_aspect_ratio.py'
              - 'public/favicons/**'
              - 'src/images/blog/**'

      - name: Set up Python
        if: steps.changes.outputs.images == 'true'
        uses: actions/setup-python@v7

      - name: Install dependencies
        if: steps.changes.outputs.images == 'true'
        run: pip install pillow loguru click

      - name: Check blog images aspect ratio and size
        if: steps.changes.outputs.images == 'true'
        run: python .github/scripts/check_aspect_ratio.py --directory src/images/blog --aspect-ratio 16:9 --max-kb 400

      - name: Check favicons aspect ratio
        if: steps.changes.outputs.images == 'true'
        run: python .github/scripts/check_aspect_ratio.py --directory public/favicons --aspect-ratio 1:1


  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Astro's optimized-image cache, saved from main by
      # warm_image_cache.yaml. Restored after `npm ci` (which wipes
      # node_modules) so the build only encodes images this PR changes.
      # Restore only: a cache saved from a PR can't be read by other PRs.
      - name: Restore Astro image cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.astro
          key: astro-images-${{ github.sha }}
          restore-keys: astro-images-

      - name: Build project
        run: npm run build

      - name: Check bundle size
        run: npm run size

      # Data-quality checks on dist/ plus unit tests (see tests/)
      - name: Test the built site
        run: npm test
