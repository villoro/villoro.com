docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - AGENTS.md
          - IMPROVEMENTS.md
          - LICENSE

CI-CD:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .pre-commit-config.yaml

config:
  - changed-files:
      - any-glob-to-any-file:
          - astro.config.mjs
          - eslint.config.js
          - netlify.toml
          - package.json
          - tsconfig.json
          - src/config/**
          - src/content.config.ts

content/general:
  - changed-files:
      - any-glob-to-any-file:
          - src/content/about/**
          - src/content/homepage/**

content/blog:
  - changed-files:
      - any-glob-to-any-file:
          - src/content/blog/**

layout:
  - changed-files:
      - any-glob-to-any-file:
          - src/layouts/**
          - src/pages/**

styles:
  - changed-files:
      - any-glob-to-any-file:
          - src/styles/**
