repos:
  # Default checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    - id: check-ast
    - id: check-yaml
    - id: check-json
    - id: check-toml
    - id: check-merge-conflict
    - id: no-commit-to-branch

  - repo: local
    hooks:
    - id: eslint
      name: eslint
      language: system
      entry: npx eslint
      files: \.(js|jsx|ts|tsx|astro)$
      exclude: ^(images|public|dist|dev-dist|node_modules|src/content|scripts|src/\.json)/
      pass_filenames: true
    - id: astro-check
      name: astro check
      language: system
      entry: npx astro check
      files: \.(ts|tsx|astro)$
      exclude: ^(images|public|dist|dev-dist|node_modules|src/content|scripts|src/\.json)/
      pass_filenames: false
